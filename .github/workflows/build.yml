# Builds RMDex-Setup-<version>.exe from this repository on GitHub's servers,
# so every release binary comes from a verifiable, automated build.
# Once SignPath is set up (see README > Code signing policy), the installer is
# sent to SignPath for signing; until then the step is skipped.
name: Build installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build app and installer
        shell: cmd
        run: build_installer.bat nopause

      # Microsoft Store package. Identity values come from Partner Center
      # (repository variables MSIX_IDENTITY_NAME, MSIX_PUBLISHER, MSIX_PUBLISHER_DISPLAY_NAME);
      # without them a placeholder identity is used, fine for checking the build.
      - name: Build Microsoft Store package (MSIX)
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: ./packaging/build_msix.ps1

      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: RMDex-msix
          path: dist/RMDex-*.msix
          if-no-files-found: error

      - name: Upload unsigned installer
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: RMDex-Setup-unsigned
          path: dist/RMDex-Setup-*.exe
          if-no-files-found: error

      # Runs only after the repository variable SIGNPATH_ORGANIZATION_ID and the
      # secret SIGNPATH_API_TOKEN have been added (Settings > Secrets and variables > Actions).
      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'RMDex' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG || 'initial' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Upload signed installer
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: RMDex-Setup-signed
          path: signed/
          if-no-files-found: error
